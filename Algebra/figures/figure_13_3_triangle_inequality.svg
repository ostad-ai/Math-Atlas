<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
  <title id="title">Triangle inequality for complex vectors</title>
  <desc id="desc">Vector z equals 3 plus i goes from the origin to (3,1). Vector w equals 1 plus 2i starts at (3,1) and ends at (4,3). Their sum is the dashed vector from the origin to (4,3). Both vector labels are offset consistently from their arrows.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#222"/>
    </marker>
    <style>
      .grid { stroke: #d8d8d8; stroke-width: 1; opacity: .7; }
      .axis { stroke: #2477b8; stroke-width: 2; }
      .tick { fill: #333; font: 15px sans-serif; }
      .axis-label { fill: #222; font: 18px sans-serif; }
      .vector { stroke: #222; stroke-width: 3.5; fill: none; marker-end: url(#arrow-black); stroke-linecap: round; }
      .resultant { stroke: #222; stroke-width: 3; fill: none; stroke-dasharray: 10 7; marker-end: url(#arrow-black); stroke-linecap: round; }
      .point { fill: #2477b8; stroke: white; stroke-width: 1.5; }
      .label { fill: #111; font-family: DejaVu Serif, serif; font-size: 21px; font-style: italic; text-anchor: middle; }
      .origin { fill: #111; font: 18px sans-serif; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="580" fill="white"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#111">Triangle inequality for complex vectors</text>

  <!-- Grid: one unit is 110 pixels. Origin O=(120,480). -->
  <g class="grid">
    <path d="M230 60 V500 M340 60 V500 M450 60 V500 M560 60 V500 M670 60 V500"/>
    <path d="M70 370 H700 M70 260 H700 M70 150 H700"/>
  </g>
  <path class="axis" d="M70 480 H705 M120 530 V55"/>
  <g class="tick" text-anchor="middle">
    <text x="230" y="505">1</text><text x="340" y="505">2</text><text x="450" y="505">3</text><text x="560" y="505">4</text><text x="670" y="505">5</text>
  </g>
  <g class="tick" text-anchor="end">
    <text x="108" y="375">1</text><text x="108" y="265">2</text><text x="108" y="155">3</text><text x="108" y="45">4</text>
  </g>
  <text class="axis-label" x="390" y="548" text-anchor="middle">Real coordinate</text>
  <text class="axis-label" transform="translate(28 285) rotate(-90)" text-anchor="middle">Imaginary coordinate</text>

  <!-- Vectors: O=(120,480), z=(450,370), z+w=(560,150). -->
  <path class="resultant" d="M120 480 L560 150"/>
  <path class="vector" d="M120 480 L450 370"/>
  <path class="vector" d="M450 370 L560 150"/>

  <circle class="point" cx="120" cy="480" r="6"/>
  <circle class="point" cx="450" cy="370" r="6"/>
  <circle class="point" cx="560" cy="150" r="6"/>
  <text class="origin" x="103" y="505">O</text>
  <!-- Both labels use the same side-of-vector placement rule and follow their vector angles. -->
  <text class="label" transform="translate(295 456) rotate(-18.435)">z = 3 + i</text>
  <text class="label" transform="translate(530 279) rotate(-63.435)">w = 1 + 2i</text>
  <text class="label" transform="translate(307 280) rotate(-36.87)">z + w = 4 + 3i</text>
</svg>
